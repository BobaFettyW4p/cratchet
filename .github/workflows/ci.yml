name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CRATCHET_IMAGE: cratchet-dev
  VCPKG_CACHE_DIR: ${{ github.workspace }}/.cache/vcpkg

# Every job: build the shared toolchain image (layer-cached), restore the vcpkg
# binary cache, then run commands inside the image via scripts/in_container.sh.
# Job names below are the required status checks for branch protection.
jobs:
  build-test:
    name: build-test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: clang-18
            cc: clang-18
            cxx: clang++-18
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          load: true
          tags: ${{ env.CRATCHET_IMAGE }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json', 'docker/dev.Dockerfile') }}
          restore-keys: vcpkg-${{ matrix.compiler }}-
      - name: Configure
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: scripts/in_container.sh cmake --preset dev -DCRATCHET_WERROR=ON
      - name: Build
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: scripts/in_container.sh cmake --build --preset dev
      - name: Test
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: scripts/in_container.sh ctest --preset dev

  sanitize-asan-ubsan:
    name: sanitize (asan+ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          load: true
          tags: ${{ env.CRATCHET_IMAGE }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-asan-${{ hashFiles('vcpkg.json', 'docker/dev.Dockerfile') }}
          restore-keys: vcpkg-asan-
      - name: Configure
        run: scripts/in_container.sh cmake --preset asan -DCRATCHET_WERROR=ON
      - name: Build
        run: scripts/in_container.sh cmake --build --preset asan
      - name: Test
        run: scripts/in_container.sh ctest --preset asan

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          load: true
          tags: ${{ env.CRATCHET_IMAGE }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-tidy-${{ hashFiles('vcpkg.json', 'docker/dev.Dockerfile') }}
          restore-keys: vcpkg-tidy-
      - name: Configure (for compile_commands.json and dependency headers)
        run: scripts/in_container.sh cmake --preset dev
      - name: Run clang-tidy
        run: >
          scripts/in_container.sh bash -c
          "find src apps tests bench -name '*.cpp'
          | xargs clang-tidy-18 -p build/dev --quiet"

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Check formatting
        run: >
          git ls-files '*.cpp' '*.hpp'
          | xargs clang-format-18 --dry-run --Werror

  # docs/contract.md §8: run Cratchet over the committed capture and check every tick with
  # LedgerFlux's own Python code (transform, validation, Tick model, shard_product) at a
  # pinned commit; then publish the same ticks to a real JetStream server and read them back
  # the way LedgerFlux consumers do. Bump LEDGERFLUX_COMMIT when LedgerFlux's Tick, ingestor
  # or stream setup changes.
  contract:
    name: contract (ledgerflux)
    runs-on: ubuntu-24.04
    env:
      LEDGERFLUX_COMMIT: 004a8c78165e2281076a226d6fbca26aa7ea223d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BobaFettyW4p/LedgerFlux
          ref: ${{ env.LEDGERFLUX_COMMIT }}
          path: .ledgerflux
      - uses: docker/setup-buildx-action@v3
      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dev.Dockerfile
          load: true
          tags: ${{ env.CRATCHET_IMAGE }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE_DIR }}
          key: vcpkg-clang-18-${{ hashFiles('vcpkg.json', 'docker/dev.Dockerfile') }}
          restore-keys: vcpkg-clang-18-
      - name: Configure
        run: scripts/in_container.sh cmake --preset dev -DCRATCHET_WERROR=ON
      - name: Build cratchet
        run: scripts/in_container.sh cmake --build --preset dev --target cratchet cratchet_tests
      - name: Normalize the sample capture
        run: >
          scripts/in_container.sh build/dev/apps/cratchet normalize
          tests/data/coinbase_sample.jsonl > ticks.tsv
      - uses: astral-sh/setup-uv@v6
      - name: Check against LedgerFlux
        run: >
          uv run --project .ledgerflux --frozen python scripts/contract_check.py
          .ledgerflux tests/data/coinbase_sample.jsonl ticks.tsv
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10.22 -js
          for _ in $(seq 30); do
            (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null && exit 0
            sleep 1
          done
          docker logs nats
          exit 1
      - name: NATS publisher integration tests
        env:
          CRATCHET_DOCKER_NETWORK: host
          CRATCHET_NATS_URL: nats://localhost:4222
        run: >
          scripts/in_container.sh build/dev/tests/cratchet_tests
          --gtest_filter='nats_publisher*'
      - name: Publish the sample capture to JetStream
        env:
          CRATCHET_DOCKER_NETWORK: host
        run: |
          echo '{"urls": "nats://localhost:4222"}' > nats.config.json
          scripts/in_container.sh build/dev/apps/cratchet normalize --publish \
            --nats-config nats.config.json tests/data/coinbase_sample.jsonl > published.tsv
      - name: Read the stream back as LedgerFlux consumers do
        run: >
          uv run --project .ledgerflux --frozen python scripts/nats_check.py
          .ledgerflux nats://localhost:4222 market_ticks market.ticks published.tsv
